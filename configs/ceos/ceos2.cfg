hostname ceos2
username admin privilege 15 secret admin
!
service routing protocols model multi-agent
!
vrf instance MGMT
!
! Default gateway for custom mgmt subnet (Containerlab bridge).
ip route vrf MGMT 0.0.0.0/0 192.168.127.1
!
interface Management0
   vrf MGMT
   ip address 192.168.127.12/24
!
interface Ethernet1
   no switchport
   ip address 10.255.0.2/30
!
interface Ethernet2
   no switchport
   ip address 10.0.2.254/24
!
ip route 10.0.1.0/24 10.255.0.1
!
management api gnmi
   transport grpc default
      vrf MGMT
!
management api netconf
   transport ssh default
      vrf MGMT
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
radius-server host 192.168.127.50 vrf MGMT key testing123
!
aaa group server radius RADIUS
   server 192.168.127.50 vrf MGMT
!
end
