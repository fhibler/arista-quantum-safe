# Lab log override — included from the packaged radiusd.conf at image build time.
# Mounted at /etc/raddb/radiusd-log.conf in the running container.
#
# clab bind-mounts lab/logs/radius → /var/log/radius.  The packaged radiusd.conf
# sets logdir under ${prefix}/var/log/radius; override so startup + auth lines
# land on the host mount (not /opt/freeradius/var/log/radius/radius.log).
logdir = /var/log/radius

log {
    destination = files
    file = /var/log/radius/radius.log
    # Log auth results (Login OK / Login incorrect) — required for dot1x/EAP debugging.
    auth = yes
    auth_goodpass = yes
    auth_badpass = yes
    stripped_names = yes
    msg_goodpass = " User-Name=%{User-Name} MAC=%{Calling-Station-Id} NAS=%{NAS-IP-Address}"
    msg_badpass = " User-Name=%{User-Name} MAC=%{Calling-Station-Id} NAS=%{NAS-IP-Address}"
}
