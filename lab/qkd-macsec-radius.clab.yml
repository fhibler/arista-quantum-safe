name: qkd-macsec-radius

mgmt:
  network: qkd-mgmt
  ipv4-subnet: 192.168.127.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.2F
      env:
        CLAB_MGMT_VRF: MGMT
  nodes:
    ceos1:
      kind: arista_ceos
      mgmt-ipv4: 192.168.127.11
      startup-config: configs/ceos/ceos1.cfg
    ceos2:
      kind: arista_ceos
      mgmt-ipv4: 192.168.127.12
      startup-config: configs/ceos/ceos2.cfg
    host1:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 192.168.127.21
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.1/24 dev eth1
        - ip route add default via 10.0.1.254 dev eth1
    host2:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 192.168.127.22
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.2.1/24 dev eth1
        - ip route add default via 10.0.2.254 dev eth1
    radius:
      kind: linux
      image: qkd-radius:latest
      mgmt-ipv4: 192.168.127.50
      binds:
        - configs/radius/raddb/clients.conf:/etc/raddb/clients.conf:ro
        - configs/radius/raddb/radiusd.conf:/etc/raddb/radiusd-log.conf:ro
        - lab/logs/radius:/var/log/radius
  links:
    - endpoints: ["ceos1:eth1", "ceos2:eth1"]
    - endpoints: ["ceos1:eth2", "host1:eth1"]
    - endpoints: ["ceos2:eth2", "host2:eth1"]
