

# site-config:begin
# Generated from site.yaml — run: make sync-site-config
site_name: Quantum Safe Lab
site_description: Post-quantum cryptography lab for Arista cEOS management plane and MACsec
site_url: https://fhibler.github.io/arista-quantum-safe/
repo_url: https://github.com/fhibler/arista-quantum-safe
repo_name: fhibler/arista-quantum-safe
edit_uri: edit/main/docs/
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fhibler/arista-quantum-safe
# site-config:end
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Setup: setup.md
  - PQC overview: pqc-overview.md
  - Services:
      - Overview: services/index.md
      - SSH: services/ssh.md
      - eAPI: services/eapi.md
      - OpenConfig & gRPC: services/openconfig.md
      - Syslog: services/syslog.md
      - RADIUS / RadSec: services/radius-radsec.md
      - MACsec: services/macsec.md
      - QKD / ETSI 014: services/qkd-etsi014.md
  - Tests:
      - Overview: tests/index.md
      - PQC connectivity: tests/pqc.md
      - RADIUS: tests/radius.md
      - Syslog: tests/syslog.md
      - MACsec: tests/macsec.md
  - Miscellaneous:
      - Overview: misc/index.md
      - Certificates and TLS 1.3: misc/certificates-and-tls13.md

plugins:
  - search
